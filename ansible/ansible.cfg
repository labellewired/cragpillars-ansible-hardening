[defaults]

# Inventory
inventory = inventory.ini

# Do not create .retry files after failures
retry_files_enabled = False

# Verify SSH host keys and reject unexpected changes
host_key_checking = True

# Display useful task output
stdout_callback = default

# Python interpreter discovery
interpreter_python = auto_silent

# SSH connection timeout
timeout = 30


[ssh_connection]

# Automatically trust new SSH host keys, but reject changed keys
# Preserve SSH connection multiplexing for better performance
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

# Reuse SSH connections for better performance
pipelining = True