---
# ============================================================
# CragPillars - Common configuration
# Applied to all servers
# ============================================================

# ------------------------------------------------------------
# Hostname
# ------------------------------------------------------------

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ crag_hostname }}"

# ------------------------------------------------------------
# Additional repositories
# ------------------------------------------------------------

- name: Install DNF plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Enable CRB repository
  community.general.ini_file:
    path: /etc/yum.repos.d/centos.repo
    section: crb
    option: enabled
    value: "1"
    mode: "0644"
    no_extra_spaces: true

- name: Install EPEL release repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

# ------------------------------------------------------------
# Essential packages
# ------------------------------------------------------------

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - sudo
      - firewalld
      - chrony
      - rsyslog
      - policycoreutils
      - python3-libselinux
    state: present

# ------------------------------------------------------------
# Users
# ------------------------------------------------------------

- name: Create CragPillars users
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
    create_home: true
    shell: /bin/bash
    groups: wheel
    append: true
  loop: "{{ crag_users }}"
  no_log: true

# ------------------------------------------------------------
# SELinux
# ------------------------------------------------------------

- name: Set SELinux to enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

# ------------------------------------------------------------
# Persistent systemd journal
# ------------------------------------------------------------

- name: Create persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Restart systemd-journald

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent systemd journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-crag.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
  notify: Restart systemd-journald

# ------------------------------------------------------------
# Sudo hardening
# ------------------------------------------------------------

- name: Ensure sudo uses a pseudo-terminal
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-crag-use-pty
    owner: root
    group: root
    mode: "0440"
    content: |
      Defaults use_pty
    validate: '/usr/sbin/visudo -cf %s'

# ------------------------------------------------------------
# Kernel hardening
# ------------------------------------------------------------

- name: Enable Address Space Layout Randomization (ASLR)
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: "2"
    state: present
    sysctl_set: true
    reload: true

# ------------------------------------------------------------
# Sudo logging
# ------------------------------------------------------------

- name: Configure sudo logging
  ansible.builtin.copy:
    dest: /etc/sudoers.d/crag-logging
    owner: root
    group: root
    mode: "0440"
    content: |
      Defaults logfile="/var/log/sudo.log"
    validate: '/usr/sbin/visudo -cf %s'

# ------------------------------------------------------------
# Services
# ------------------------------------------------------------

- name: Enable common services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - firewalld
    - chronyd
    - rsyslog
