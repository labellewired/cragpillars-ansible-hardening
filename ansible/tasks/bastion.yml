---
# ============================================================
# CragPillars - Bastion server configuration
# Applied only to bastion.crag.internal
# ============================================================

# ------------------------------------------------------------
# Ansible controller
# ------------------------------------------------------------

- name: Install Ansible
  ansible.builtin.dnf:
    name: ansible-core
    state: present

# ------------------------------------------------------------
# Fail2ban
# ------------------------------------------------------------

- name: Install Fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present

- name: Configure Fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 10m
  notify: Restart Fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

# ------------------------------------------------------------
# Firewalld - Public SSH exception
# ------------------------------------------------------------

# The common firewall configuration removes SSH from the public
# zone. Only the designated MFA workstation is permitted to
# reach Bastion SSH through the public interface.

# Log other SSH attempts reaching the public zone.
# This rule logs the attempt but does not accept it.

- name: Log public SSH attempts
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      service name="ssh"
      log prefix="CRAG-SSH " limit value="5/m"
    state: enabled
    permanent: true
    immediate: true
